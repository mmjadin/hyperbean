<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperBean</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        font-family: Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .page {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      img {
        display: block;
        max-width: 100%;
        width: 900px;
        height: auto;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <img src="underconstruction.gif" alt="Under construction" />
    </div>
  </body>
</html>
